name: Test and verify experimental module

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mods/package-lock.json

      - name: Verify committed TV module integrity
        shell: bash
        run: |
          printf '%s  %s\n' 'ae26eb30188448c551a4a098adca899647865c5af41ac91108cb7dc6eba2c2f0' 'dist/userScript.js' | sha256sum --check

      - name: Install locked dependencies (without install scripts)
        working-directory: mods
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test TizenTube module
        run: node --test mods/tests/*.test.js

      - name: Test retained DIAL service source
        run: node --test service/tests/*.test.cjs

      - name: Rebuild module from published source
        working-directory: mods
        run: npm run build

      - name: Check generated bundle syntax
        run: |
          test -s dist/userScript.js
          node --check dist/userScript.js
